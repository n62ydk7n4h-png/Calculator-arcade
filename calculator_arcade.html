<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Arcade</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1d2943;--text:#eef3ff;--muted:#a8b5d1;--accent:#65e0bd;--accent2:#7aa7ff;--danger:#ff758f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a2b4a,#0b1020 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#092019;font-weight:750}
button.secondary{background:var(--panel2);color:var(--text);border:1px solid #344361}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{width:min(1100px,94vw);margin:0 auto;padding:28px 0 50px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.brand{font-size:1.2rem;font-weight:850;letter-spacing:.04em}.brand span{color:var(--accent)}
.tag{color:var(--muted);font-size:.88rem}
.screen{max-width:420px;margin:6vh auto;background:linear-gradient(160deg,#1b2944,#111a2d);border:1px solid #344361;border-radius:25px;padding:24px;box-shadow:0 24px 70px #0008}
.display{background:#080e1b;border:1px solid #344361;border-radius:14px;padding:17px;text-align:right;font:2rem ui-monospace,monospace;min-height:72px;overflow:hidden;letter-spacing:.12em}
.hint{color:var(--muted);font-size:.85rem;min-height:24px;margin:10px 2px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.keys button{padding:16px 8px;font-size:1.1rem;background:#293955;color:var(--text)}.keys button.op{background:#355b70}.keys button.enter{background:var(--accent);color:#092019}.keys button.clear{background:#67394a}
#arcade{display:none}.hero{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap;margin:18px 0 22px}.hero h1{font-size:clamp(2rem,5vw,3.3rem);margin:0}.hero p{color:var(--muted);margin:6px 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{background:var(--panel2);color:var(--muted);border:1px solid #344361}.filters button.active{background:var(--accent);color:#092019;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.game{background:linear-gradient(150deg,#1b2944,#121b2d);border:1px solid #2d3c59;border-radius:18px;padding:18px;min-height:165px;display:flex;flex-direction:column;align-items:flex-start}.emoji{font-size:2rem}.game h3{margin:9px 0 4px}.game p{color:var(--muted);font-size:.9rem;margin:0 0 15px;flex:1}.game button{width:100%}
#playArea{display:none;margin-top:22px;background:#111a2d;border:1px solid #344361;border-radius:20px;padding:20px}.playhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.playhead h2{margin:0}.gamebody{padding:18px 0 2px;text-align:center}.gamebody canvas{max-width:100%;background:#070d18;border:1px solid #344361;border-radius:12px;touch-action:manipulation}.big{font-size:2rem;font-weight:850}.muted{color:var(--muted)}.memory{display:grid;grid-template-columns:repeat(4,minmax(55px,85px));justify-content:center;gap:9px}.memory button{height:70px;font-size:1.5rem;background:#293955;color:white}.memory button.revealed{background:#315c60}.ttt{display:grid;grid-template-columns:repeat(3,85px);justify-content:center;gap:8px}.ttt button{height:85px;font-size:2rem;background:#293955;color:white}.tiles{display:grid;grid-template-columns:repeat(4, minmax(52px,75px));justify-content:center;gap:7px}.tiles button{height:65px;background:#293955;color:white;font-size:1.2rem}.tiles button.filled{background:#477c75}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
footer{text-align:center;color:#8090ae;font-size:.8rem;margin-top:30px}
@media(max-width:520px){.wrap{padding-top:16px}.screen{margin:3vh auto;padding:18px}.keys button{padding:14px 5px}.hero{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">▦ <span>CALCULATOR</span> ARCADE</div><div class="tag">Mini-games • One-page arcade</div></header>
<section id="lock" class="screen">
  <div class="tag" style="margin-bottom:10px">CALCULATOR</div>
  <div id="display" class="display">0</div>
  <div id="hint" class="hint">Enter the access code to open the arcade.</div>
  <div class="keys">
    <button onclick="key('7')">7</button><button onclick="key('8')">8</button><button onclick="key('9')">9</button><button class="op" onclick="key('/')">÷</button>
    <button onclick="key('4')">4</button><button onclick="key('5')">5</button><button onclick="key('6')">6</button><button class="op" onclick="key('*')">×</button>
    <button onclick="key('1')">1</button><button onclick="key('2')">2</button><button onclick="key('3')">3</button><button class="op" onclick="key('-')">−</button>
    <button class="clear" onclick="clearDisplay()">C</button><button onclick="key('0')">0</button><button onclick="key('.')">.</button><button class="op" onclick="key('+')">+</button>
    <button class="secondary" style="grid-column:span 2" onclick="backspace()">⌫</button><button class="enter" style="grid-column:span 2" onclick="submitCode()">ENTER</button>
  </div>
  <p class="tag" style="text-align:center;margin:16px 0 0">Demo access code: <b style="color:var(--accent)">0000</b></p>
</section>
<section id="arcade">
  <div class="hero"><div><h1>Game time<span style="color:var(--accent)">.</span></h1><p>Pick a mini-game and set a new high score.</p></div><button class="secondary" onclick="lockAgain()">← Calculator</button></div>
  <div class="filters" id="filters"></div><div class="grid" id="games"></div>
  <section id="playArea"><div class="playhead"><h2 id="gameTitle">Game</h2><button class="secondary" onclick="closeGame()">Close game</button></div><div id="gameBody" class="gamebody"></div></section>
</section>
<footer>Made for fun. Games run locally in this page; no accounts needed.</footer>
</div>
<script>
let display='0';
function paint(){document.getElementById('display').textContent=display}
function key(v){display=display==='0'?v:display+v;paint()}
function clearDisplay(){display='0';paint();document.getElementById('hint').textContent='Enter the access code to open the arcade.'}
function backspace(){display=display.length>1?display.slice(0,-1):'0';paint()}
function submitCode(){if(display==='0000'){document.getElementById('lock').style.display='none';document.getElementById('arcade').style.display='block';renderGames()}else{document.getElementById('hint').textContent='That code did not match. Try again.';display='0';paint()}}
function lockAgain(){closeGame();document.getElementById('arcade').style.display='none';document.getElementById('lock').style.display='block';clearDisplay()}
const gameList=[
{id:'snake',name:'Snake',cat:'Arcade',emoji:'🐍',desc:'Eat the dots and avoid your tail.'},
{id:'memory',name:'Memory Match',cat:'Puzzle',emoji:'🧠',desc:'Flip cards and find matching pairs.'},
{id:'ttt',name:'Tic-Tac-Toe',cat:'Puzzle',emoji:'❎',desc:'Play against a friend on the same device.'},
{id:'reaction',name:'Reaction Test',cat:'Skill',emoji:'⚡',desc:'Wait for green, then tap as fast as you can.'},
{id:'clicker',name:'Target Tap',cat:'Skill',emoji:'🎯',desc:'Tap as many targets as you can in 20 seconds.'},
{id:'2048',name:'2048',cat:'Puzzle',emoji:'🔢',desc:'Combine matching numbers to reach 2048.'},
{id:'breakout',name:'Brick Breaker',cat:'Arcade',emoji:'🧱',desc:'Bounce the ball and clear the bricks.'},
{id:'racer',name:'Lane Racer',cat:'Racing',emoji:'🏎️',desc:'Dodge traffic and survive as long as you can.'},
{id:'basket',name:'Hoop Shot',cat:'Sports',emoji:'🏀',desc:'Time your shots and score baskets.'},
{id:'soccer',name:'Soccer Keep-Up',cat:'Sports',emoji:'⚽',desc:'Keep the ball in the air with quick taps.'}
];
let activeFilter='All',cleanup=null;
function renderGames(){let cats=['All',...new Set(gameList.map(g=>g.cat))];document.getElementById('filters').innerHTML=cats.map(c=>`<button class="${activeFilter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');document.getElementById('games').innerHTML=gameList.filter(g=>activeFilter==='All'||g.cat===activeFilter).map(g=>`<article class="game"><div class="emoji">${g.emoji}</div><h3>${g.name}</h3><p>${g.desc}</p><button onclick="startGame('${g.id}')">Play now</button></article>`).join('')}
function setFilter(c){activeFilter=c;renderGames()}
function closeGame(){if(cleanup){cleanup();cleanup=null}document.getElementById('playArea').style.display='none';document.getElementById('gameBody').innerHTML=''}
function startGame(id){closeGame();let g=gameList.find(x=>x.id===id);document.getElementById('gameTitle').textContent=g.name;document.getElementById('playArea').style.display='block';document.getElementById('playArea').scrollIntoView({behavior:'smooth',block:'start'});({snake, memory, ttt, reaction, clicker, '2048':game2048, breakout, racer, basket, soccer}[id])()}
function snake(){let body=document.getElementById('gameBody');body.innerHTML='<p class="muted">Use arrow keys or the buttons. Eat the green square.</p><canvas id="cv" width="360" height="360"></canvas><div class="controls"><button class="secondary" onclick="snakeDir(0,-1)">↑</button></div><div class="controls"><button class="secondary" onclick="snakeDir(-1,0)">←</button><button class="secondary" onclick="snakeDir(0,1)">↓</button><button class="secondary" onclick="snakeDir(1,0)">→</button><button onclick="snakeRestart()">Restart</button></div><p id="score" class="big">Score: 0</p>';let c=document.getElementById('cv'),ctx=c.getContext('2d'),s=18,parts=[{x:9,y:10},{x:8,y:10}],dir={x:1,y:0},food={x:14,y:10},score=0,over=false;window.snakeDir=(x,y)=>{if(x!==-dir.x||y!==-dir.y)dir={x,y}};function tick(){if(over)return;let h={x:parts[0].x+dir.x,y:parts[0].y+dir.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||parts.some(p=>p.x===h.x&&p.y===h.y)){over=true;document.getElementById('score').textContent='Game over — score: '+score;return}parts.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};document.getElementById('score').textContent='Score: '+score}else parts.pop();ctx.fillStyle='#070d18';ctx.fillRect(0,0,360,360);ctx.fillStyle='#65e0bd';parts.forEach(p=>ctx.fillRect(p.x*s+1,p.y*s+1,s-2,s-2));ctx.fillStyle='#ff758f';ctx.fillRect(food.x*s+2,food.y*s+2,s-4,s-4)}let timer=setInterval(tick,130);let handler=e=>{let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(m[e.key]){e.preventDefault();snakeDir(...m[e.key])}};window.addEventListener('keydown',handler);tick();cleanup=()=>{clearInterval(timer);window.removeEventListener('keydown',handler)};window.snakeRestart=()=>{cleanup();snake()}}
function memory(){let vals=['🍎','🚀','🐸','🎲','🌟','⚽','🎧','🍕'];let deck=[...vals,...vals].sort(()=>Math.random()-.5),open=[],done=[],moves=0;let b=document.getElementById('gameBody');b.innerHTML='<p class="muted">Find all 8 matching pairs.</p><p id="memscore">Moves: 0</p><div class="memory" id="mem"></div>';function draw(){document.getElementById('mem').innerHTML=deck.map((v,i)=>`<button class="${open.includes(i)||done.includes(i)?'revealed':''}" onclick="flip(${i})">${open.includes(i)||done.includes(i)?v:'?'}</button>`).join('');document.getElementById('memscore').textContent=done.length===16?'You won in '+moves+' moves!':'Moves: '+moves}window.flip=i=>{if(open.length===2||open.includes(i)||done.includes(i))return;open.push(i);draw();if(open.length===2){moves++;if(deck[open[0]]===deck[open[1]]){done.push(...open);open=[];draw()}else setTimeout(()=>{open=[];draw()},700)}};draw();cleanup=()=>{window.flip=null}}
function ttt(){let board=Array(9).fill(''),turn='X',ended=false;let b=document.getElementById('gameBody');b.innerHTML='<p id="tttmsg">X goes first</p><div class="ttt" id="tttgrid"></div><div class="controls"><button onclick="tttReset()">New round</button></div>';function draw(){document.getElementById('tttgrid').innerHTML=board.map((v,i)=>`<button onclick="tttMove(${i})">${v}</button>`).join('')}window.tttMove=i=>{if(ended||board[i])return;board[i]=turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let win=wins.some(a=>a.every(k=>board[k]===turn));if(win){ended=true;document.getElementById('tttmsg').textContent=turn+' wins!'}else if(board.every(Boolean)){ended=true;document.getElementById('tttmsg').textContent='It is a draw!'}else{turn=turn==='X'?'O':'X';document.getElementById('tttmsg').textContent=turn+' goes next'}draw()};window.tttReset=()=>{board=Array(9).fill('');turn='X';ended=false;document.getElementById('tttmsg').textContent='X goes first';draw()};draw();cleanup=()=>{}}
function reaction(){let b=document.getElementById('gameBody'),state='wait',start=0,timer; b.innerHTML='<p id="reactmsg">Press start, wait for green, then tap.</p><button id="reactbtn" style="font-size:1.3rem;padding:25px 40px;background:#355b70;color:white">Start</button>';let btn=document.getElementById('reactbtn'),msg=document.getElementById('reactmsg');btn.onclick=()=>{if(state==='wait'){state='ready';btn.textContent='Wait...';btn.style.background='#a85c42';let delay=1000+Math.random()*3000;timer=setTimeout(()=>{state='go';start=performance.now();btn.textContent='TAP NOW!';btn.style.background='#65e0bd';msg.textContent='GO!'},delay)}else if(state==='ready'){clearTimeout(timer);state='wait';msg.textContent='Too soon! Press start to try again.';btn.textContent='Start';btn.style.background='#355b70'}else if(state==='go'){let ms=Math.round(performance.now()-start);state='wait';msg.textContent='Your reaction time: '+ms+' ms';btn.textContent='Try again';btn.style.background='#355b70'}};cleanup=()=>clearTimeout(timer)}
function clicker(){let b=document.getElementById('gameBody');b.innerHTML='<p>Tap the target as many times as you can in 20 seconds.</p><div class="big" id="clickscore">0</div><p id="clicktime">Time: 20</p><button id="target" style="width:130px;height:100px;border-radius:50%;font-size:2rem">🎯</button><div class="controls"><button class="secondary" id="clickstart">Start</button></div>';let score=0,left=20,timer,playing=false;let target=document.getElementById('target');target.disabled=true;target.onclick=()=>{if(playing){score++;document.getElementById('clickscore').textContent=score}};document.getElementById('clickstart').onclick=()=>{if(playing)return;score=0;left=20;playing=true;target.disabled=false;document.getElementById('clickscore').textContent=0;timer=setInterval(()=>{left--;document.getElementById('clicktime').textContent='Time: '+left;if(left<=0){clearInterval(timer);playing=false;target.disabled=true;document.getElementById('clicktime').textContent='Time is up! Final score: '+score}},1000)};cleanup=()=>clearInterval(timer)}
function game2048(){let board=Array(16).fill(0);function add(){let empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);if(empty.length)board[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4}add();add();let b=document.getElementById('gameBody');b.innerHTML='<p class="muted">Use arrow keys or buttons to combine matching tiles.</p><div class="tiles" id="tilegrid"></div><div class="controls"><button class="secondary" onclick="move2048(&quot;ArrowLeft&quot;)">←</button><button class="secondary" onclick="move2048(&quot;ArrowUp&quot;)">↑</button><button class="secondary" onclick="move2048(&quot;ArrowDown&quot;)">↓</button><button class="secondary" onclick="move2048(&quot;ArrowRight&quot;)">→</button><button onclick="reset2048()">Restart</button></div><p id="tilemsg"></p>';function draw(){document.getElementById('tilegrid').innerHTML=board.map(v=>`<button class="${v?'filled':''}">${v||''}</button>`).join('');document.getElementById('tilemsg').textContent='Score: '+board.reduce((a,v)=>a+v,0)}window.move2048=dir=>{let old=board.join(',');for(let line=0;line<4;line++){let ids=Array.from({length:4},(_,i)=>dir==='ArrowLeft'?line*4+i:dir==='ArrowRight'?line*4+3-i:dir==='ArrowUp'?i*4+line:(3-i)*4+line);let vals=ids.map(i=>board[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);i++}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,i)=>board[id]=out[i])}if(old!==board.join(','))add();draw()};window.reset2048=()=>{board=Array(16).fill(0);add();add();draw()};let handler=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();move2048(e.key)}};window.addEventListener('keydown',handler);draw();cleanup=()=>window.removeEventListener('keydown',handler)}
function breakout(){let b=document.getElementById('gameBody');b.innerHTML='<p class="muted">Move your mouse or finger across the canvas to move the paddle.</p><canvas id="br" width="420" height="300"></canvas><p id="brmsg">Break all the bricks!</p><button onclick="startBreakout()">Restart</button>';let c=document.getElementById('br'),ctx=c.getContext('2d'),x=210,y=220,dx=3,dy=-3,p=170,bricks=[],running=true;function reset(){x=210;y=220;dx=3;dy=-3;bricks=[];for(let r=0;r<4;r++)for(let k=0;k<8;k++)bricks.push({x:8+k*51,y:20+r*24,on:true})}reset();let move=e=>{let rect=c.getBoundingClientRect();p=(e.clientX-rect.left)*c.width/rect.width};c.addEventListener('pointermove',move);function frame(){if(!running)return;ctx.clearRect(0,0,420,300);ctx.fillStyle='#65e0bd';bricks.forEach(a=>{if(a.on)ctx.fillRect(a.x,a.y,44,15)});ctx.fillStyle='#7aa7ff';ctx.fillRect(p-38,275,76,10);ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();x+=dx;y+=dy;if(x<7||x>413)dx*=-1;if(y<7)dy*=-1;if(y>268&&y<290&&x>p-45&&x<p+45)dy=-Math.abs(dy);bricks.forEach(a=>{if(a.on&&x>a.x&&x<a.x+44&&y>a.y&&y<a.y+15){a.on=false;dy*=-1}});if(y>305){running=false;document.getElementById('brmsg').textContent='Game over — restart to play again.'}else if(bricks.every(a=>!a.on)){running=false;document.getElementById('brmsg').textContent='You cleared all the bricks!'}else raf=requestAnimationFrame(frame)}let raf=requestAnimationFrame(frame);window.startBreakout=()=>{cancelAnimationFrame(raf);running=false;cleanup();breakout()};cleanup=()=>{running=false;cancelAnimationFrame(raf);c.removeEventListener('pointermove',move)}}
function racer(){let b=document.getElementById('gameBody');b.innerHTML='<p>Use ← and → to switch lanes and dodge the traffic.</p><canvas id="race" width="300" height="420"></canvas><p id="racemsg">Score: 0</p><div class="controls"><button class="secondary" onclick="raceMove(-1)">← Left</button><button class="secondary" onclick="raceMove(1)">Right →</button><button onclick="raceRestart()">Restart</button></div>';let c=document.getElementById('race'),ctx=c.getContext('2d'),lane=1,obs=[],score=0,over=false,frameN=0;window.raceMove=d=>lane=Math.max(0,Math.min(2,lane+d));function frame(){if(over)return;frameN++;if(frameN%55===0)obs.push({lane:Math.floor(Math.random()*3),y:-50});ctx.clearRect(0,0,300,420);ctx.strokeStyle='#8290aa';ctx.setLineDash([18,15]);ctx.beginPath();ctx.moveTo(100,0);ctx.lineTo(100,420);ctx.moveTo(200,0);ctx.lineTo(200,420);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#65e0bd';ctx.fillRect(12+lane*100,350,76,48);ctx.fillStyle='#ff758f';obs.forEach(o=>{o.y+=4;ctx.fillRect(12+o.lane*100,o.y,76,48);if(o.lane===lane&&o.y>310&&o.y<395)over=true});obs=obs.filter(o=>o.y<440);if(frameN%10===0)score++;document.getElementById('racemsg').textContent=over?'Crash! Score: '+score:'Score: '+score;if(!over)raf=requestAnimationFrame(frame)}let raf=requestAnimationFrame(frame);let h=e=>{if(e.key==='ArrowLeft')raceMove(-1);if(e.key==='ArrowRight')raceMove(1)};window.addEventListener('keydown',h);window.raceRestart=()=>{cleanup();racer()};cleanup=()=>{over=true;cancelAnimationFrame(raf);window.removeEventListener('keydown',h)}}
function basket(){let b=document.getElementById('gameBody');b.innerHTML='<p>Tap SHOOT when the moving power meter is near the center.</p><div class="big" id="bscore">Score: 0</div><div style="height:22px;background:#293955;border-radius:20px;overflow:hidden;max-width:320px;margin:20px auto"><div id="power" style="height:100%;width:8%;background:#65e0bd"></div></div><button id="shoot" style="font-size:1.2rem">🏀 SHOOT</button><p id="bmsg">Ready?</p><button class="secondary" onclick="basket()">Restart</button>';let score=0,p=0,dir=1,shots=0;let timer=setInterval(()=>{p+=dir*3;if(p>100||p<0)dir*=-1;document.getElementById('power').style.width=p+'%'},40);document.getElementById('shoot').onclick=()=>{if(shots>=10)return;shots++;let good=Math.max(0,100-Math.abs(p-55)*2);if(good>75)score++;document.getElementById('bscore').textContent='Score: '+score+'/10';document.getElementById('bmsg').textContent=good>75?'Swish! 🏀':'Miss! Try to hit the middle.';if(shots===10)document.getElementById('bmsg').textContent='Final score: '+score+'/10'};cleanup=()=>clearInterval(timer)}
function soccer(){let b=document.getElementById('gameBody');b.innerHTML='<p>Tap the ball each time it rises. How many keep-ups can you get?</p><div class="big" id="snum">0</div><button id="ball" style="font-size:4rem;background:transparent;color:white">⚽</button><p id="smsg">Tap to start!</p><button class="secondary" onclick="soccer()">Restart</button>';let n=0,active=false;let ball=document.getElementById('ball');ball.onclick=()=>{if(!active){active=true;document.getElementById('smsg').textContent='Keep it going!';}n++;document.getElementById('snum').textContent=n;ball.style.transform='translateY(-'+(15+Math.random()*45)+'px)';setTimeout(()=>ball.style.transform='translateY(0)',120)};cleanup=()=>{}}
</script>
</body></html>
